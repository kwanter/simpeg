name: PHP Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: php-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, sqlite3, pdo, pdo_sqlite, gd, intl, zip, dom, curl
          coverage: none
          tools: pint

      - name: Install and verify qpdf runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
          export PKP_QPDF_BINARY="$(command -v qpdf)"
          echo "PKP_QPDF_BINARY=$PKP_QPDF_BINARY" >> "$GITHUB_ENV"
          php <<'PHP'
          <?php
          $binary = getenv('PKP_QPDF_BINARY');
          if (! is_string($binary) || ! str_starts_with($binary, '/') || ! is_executable($binary)) {
              exit(1);
          }
          exec(escapeshellarg($binary).' --version', $output, $status);
          echo implode(PHP_EOL, $output), PHP_EOL;
          if ($status !== 0 || preg_match('/^qpdf version (\\d+)\\./', $output[0] ?? '', $matches) !== 1 || (int) $matches[1] < 11) {
              exit(1);
          }
          PHP

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (all dependencies)
        # Axios ships in the browser bundle despite being a devDependency.
        run: npm audit --include=dev --audit-level=high --package-lock-only --ignore-scripts

      - name: Build frontend assets
        run: npm run build

      - name: Run Pint (lint)
        run: |
          vendor/bin/pint --test
          vendor/bin/pint --test .github/ComposerAuditPolicy.php .github/check-composer-audit.php

      - name: Run PHP tests
        run: php artisan test

      - name: Composer audit (reviewed baseline)
        # Owner: kwanter; review by 2026-11-21 UTC; remove after the framework upgrade.
        # Only four reviewed Laravel GHSAs are tolerated, never the whole package.
        # Reasons and IDs: .github/ComposerAuditPolicy.php and the dependency review.
        run: |
          audit_status=0
          composer --no-cache --no-plugins --no-scripts audit --locked --no-interaction --format=json > composer-audit.json || audit_status=$?
          cat composer-audit.json
          php .github/check-composer-audit.php composer-audit.json "$audit_status"
