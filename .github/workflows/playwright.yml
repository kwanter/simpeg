name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, pdo, pdo_sqlite, gd, intl, zip, dom, curl
          coverage: none

      - name: Install and verify qpdf runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
          export PKP_QPDF_BINARY="$(command -v qpdf)"
          echo "PKP_QPDF_BINARY=$PKP_QPDF_BINARY" >> "$GITHUB_ENV"
          php <<'PHP'
          <?php
          $binary = getenv('PKP_QPDF_BINARY');
          if (! is_string($binary) || ! str_starts_with($binary, '/') || ! is_executable($binary)) {
              exit(1);
          }
          exec(escapeshellarg($binary).' --version', $output, $status);
          echo implode(PHP_EOL, $output), PHP_EOL;
          if ($status !== 0 || preg_match('/^qpdf version (\\d+)\\./', $output[0] ?? '', $matches) !== 1 || (int) $matches[1] < 11) {
              exit(1);
          }
          PHP

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-playwright-${{ hashFiles('composer.lock') }}
          restore-keys: composer-playwright-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          APP_URL: http://127.0.0.1:8000

      - name: Run PKP Playwright tests
        run: npx playwright test --config=playwright.pkp.config.js --project=chromium
        env:
          PKP_E2E_BASE_URL: http://127.0.0.1:8001

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  qpdf-runtimes:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify qpdf in Apache image
        run: |
          docker build --file docker/apache/Dockerfile --tag simpeg-apache-qpdf:test docker/apache
          docker run --rm --entrypoint php --env PKP_QPDF_BINARY=/usr/bin/qpdf simpeg-apache-qpdf:test -r '$b=getenv("PKP_QPDF_BINARY"); exec(escapeshellarg($b)." --version", $o, $s); if ($s !== 0 || preg_match("/^qpdf version (\\d+)\\./", $o[0] ?? "", $m) !== 1 || (int) $m[1] < 11) exit(1); echo $o[0], PHP_EOL;'
      - name: Build and verify qpdf in workspace image
        run: |
          docker build --file docker/development/workspace/Dockerfile --tag simpeg-workspace-qpdf:test .
          docker run --rm --entrypoint php --env PKP_QPDF_BINARY=/usr/bin/qpdf simpeg-workspace-qpdf:test -r '$b=getenv("PKP_QPDF_BINARY"); exec(escapeshellarg($b)." --version", $o, $s); if ($s !== 0 || preg_match("/^qpdf version (\\d+)\\./", $o[0] ?? "", $m) !== 1 || (int) $m[1] < 11) exit(1); echo $o[0], PHP_EOL;'
